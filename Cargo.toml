[package]
name = "shutdown-kit"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "Graceful shutdown for Rust services — signal handling, connection draining, and RAII cleanup guards"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/shutdown-kit"
keywords = ["shutdown", "graceful", "signal", "axum", "tokio"]
categories = ["asynchronous", "web-programming"]
exclude = ["/target"]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
criterion = { version = "0.7", features = ["html_reports"] }

[features]
# `CancellationToken` bridge for estates standardised on
# `tokio_util::sync::CancellationToken` (kestrel-class consumers).
tokio-util = ["dep:tokio-util"]

default = ["std"]
std = []
shutdown-flag = []

[[bench]]
name = "shutdown_bench"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
